name: ESPN Analytics WCBB — validated refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 2,5'
      timezone: 'America/Los_Angeles'

permissions:
  contents: write

concurrency:
  group: wcbb-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Test transformations and QA gates
        run: PYTHONPATH=src python -m pytest -q tests
      - name: Fetch provider feeds and build DuckDB
        run: python scripts/refresh_wcbb.py --season 2026
      - name: Verify publish manifest
        run: python scripts/check_manifest.py
      - name: Commit only validated data snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/frozen data/latest data/snapshots reports/manifest_latest.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit'
          else
            git commit -m "data(wcbb): publish validated ESPN snapshot [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
