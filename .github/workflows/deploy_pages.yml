# This project is a data pipeline, not a GitHub Pages publication.
# The inherited template Pages workflow is replaced with a manual-only notice.
name: Pages disabled for WCBB pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Pages is intentionally disabled; validate and refresh workflows own this repository.'
